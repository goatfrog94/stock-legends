<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주식전설</title>
<style>
  :root{
    --bg:#ffffff; --surface:#f2f4f6; --surface2:#f9fafb; --line:#e5e8eb;
    --text:#191f28; --sub:#8b95a1; --sub2:#b0b8c1;
    --up:#f04452; --down:#3182f6; --accent:#3182f6; --accent-weak:#e8f3ff;
    --warn:#ff9f0a; --good:#15c47e;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','맑은 고딕',sans-serif;
    background:var(--surface); color:var(--text);
    font-feature-settings:'tnum'; -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input{font-family:inherit}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}

  #app{display:flex; flex-direction:column; height:100vh}
  #topbar{
    height:56px; flex:0 0 56px; background:var(--bg); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; padding:0 20px;
  }
  #main{flex:1; display:grid; grid-template-columns:250px 1fr 310px; gap:12px; padding:12px; min-height:0}
  .pane{background:var(--bg); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; min-height:0}

  /* 상단바 */
  .logo{font-weight:800; font-size:15px; letter-spacing:-.3px}
  .logo span{color:var(--accent)}
  .gdate{font-weight:800; font-size:17px; letter-spacing:-.4px; min-width:110px}
  .era{font-size:12px; font-weight:700; padding:4px 9px; border-radius:7px; background:var(--surface); color:var(--sub)}
  .era.crash{background:#fff0f1; color:var(--up)}
  .era.bull{background:var(--accent-weak); color:var(--accent)}
  .idx{font-size:12px; color:var(--sub); font-weight:600}
  .idx b{color:var(--text); font-weight:800; font-size:13px}
  .spacer{flex:1}
  .speed{display:flex; background:var(--surface); border-radius:9px; padding:3px; gap:2px}
  .speed button{padding:5px 11px; border-radius:7px; font-size:12px; font-weight:700; color:var(--sub)}
  .speed button.on{background:var(--bg); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tgl{font-size:12px; font-weight:700; color:var(--sub); padding:6px 10px; border-radius:8px; background:var(--surface)}
  .tgl.on{background:var(--accent-weak); color:var(--accent)}
  .tgl.primary{background:var(--accent); color:#fff}

  .tglwrap{position:relative}
  .pop{
    position:absolute; top:calc(100% + 8px); right:0; z-index:50; min-width:238px;
    background:var(--bg); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 8px 28px rgba(0,0,0,.13); padding:8px;
  }
  .poprow{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:8px 10px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; user-select:none;
  }
  .poprow:hover{background:var(--surface2)}
  .poprow.master{font-weight:800}
  .poprow.dim{color:var(--sub2)}
  .popsep{height:1px; background:var(--line); margin:6px 4px}
  .poplabel{font-size:11px; font-weight:800; color:var(--sub2); padding:4px 10px 2px}
  .pop input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex:0 0 16px}
  .seg{display:flex; gap:4px; padding:2px 10px 6px}
  .seg button{flex:1; padding:6px 0; border-radius:8px; background:var(--surface); font-size:11.5px; font-weight:700; color:var(--sub)}
  .seg button.on{background:var(--accent); color:#fff}

  /* 좌: 관심종목 */
  .ptitle{padding:16px 16px 8px; font-size:13px; font-weight:800; color:var(--sub)}
  .wlist{overflow-y:auto; flex:1}
  .witem{
    display:flex; align-items:center; gap:9px; padding:11px 14px; cursor:pointer;
    border-left:3px solid transparent; user-select:none;
  }
  .witem:hover{background:var(--surface2)}
  .witem.sel{background:var(--accent-weak); border-left-color:var(--accent)}
  .dot{width:8px; height:8px; border-radius:3px; flex:0 0 8px}
  .wname{flex:1; min-width:0}
  .wname b{display:block; font-size:13.5px; font-weight:800; letter-spacing:-.3px}
  .wname small{font-size:11px; color:var(--sub2); font-weight:600}
  .wprice{text-align:right}
  .wprice b{display:block; font-size:13px; font-weight:800}
  .wprice small{font-size:11px; font-weight:700}
  .badge{font-size:9.5px; font-weight:800; padding:2px 5px; border-radius:4px; background:var(--accent); color:#fff; margin-left:4px}
  .refbox{padding:12px 16px; border-top:1px solid var(--line)}
  .refbox h4{font-size:11px; font-weight:800; color:var(--sub2); margin-bottom:6px}

  /* 중: 차트 */
  .chead{padding:16px 20px 12px; border-bottom:1px solid var(--line)}
  .chead h1{font-size:20px; font-weight:800; letter-spacing:-.5px; display:flex; align-items:center; gap:8px}
  .arch{font-size:11px; font-weight:700; color:var(--sub); background:var(--surface); padding:3px 8px; border-radius:6px}
  .cprice{display:flex; align-items:baseline; gap:10px; margin-top:6px}
  .cprice .p{font-size:28px; font-weight:800; letter-spacing:-1px}
  .cprice .ch{font-size:14px; font-weight:700}
  .ctabs{display:flex; gap:4px; padding:10px 20px 0}
  .ctabs button{padding:5px 12px; border-radius:8px; font-size:12px; font-weight:700; color:var(--sub)}
  .ctabs button.on{background:var(--surface); color:var(--text)}
  #cvWrap{flex:1; position:relative; min-height:0; padding:6px 12px 12px}
  #cv{width:100%; height:100%; display:block; cursor:crosshair}
  .legend{position:absolute; top:12px; left:24px; font-size:11px; font-weight:700; display:flex; gap:12px; pointer-events:none}
  .legend i{display:inline-block; width:8px; height:2px; vertical-align:3px; margin-right:4px}
  /* 정지 사유(1행) + 뉴스(1행). 정지 여부와 무관하게 높이를 고정해 차트가 흔들리지 않게 한다 */
  .news{
    border-top:1px solid var(--line); padding:8px 20px; min-height:58px;
    display:flex; flex-direction:column; justify-content:center; gap:3px;
  }
  .nrow{
    font-size:12.5px; font-weight:600; color:var(--sub); line-height:1.45;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .nrow b{color:var(--text); font-weight:800}
  .nrow.pause{color:var(--accent)}
  .nrow.pause b{color:var(--accent)}

  /* 우: 계좌 */
  .rscroll{overflow-y:auto; flex:1; padding:14px}
  .card{background:var(--surface2); border-radius:12px; padding:14px; margin-bottom:10px}
  .card h3{font-size:12px; font-weight:800; color:var(--sub); margin-bottom:10px; display:flex; justify-content:space-between}
  .kv{display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; font-size:12.5px}
  .kv span{color:var(--sub); font-weight:600}
  .kv b{font-weight:800; font-size:13px}
  .equity{font-size:26px; font-weight:800; letter-spacing:-1px}
  .alpha{font-size:12px; font-weight:700; margin-bottom:10px}
  .alphabox{
    display:flex; justify-content:space-between; align-items:center; margin-top:10px;
    padding:10px 12px; border-radius:10px; background:var(--bg); border:1px solid var(--line);
  }
  .alphabox span{font-size:12px; font-weight:700; color:var(--sub)}
  .alphabox b{font-size:17px; font-weight:800}

  /* 비중 바 */
  .wbar{display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--line); margin-bottom:10px}
  .wbar div{height:100%; transition:width .18s ease}
  .poslist{margin-top:2px}
  .pos{display:flex; align-items:center; gap:8px; padding:8px 4px; border-top:1px solid var(--line);
       font-size:12.5px; cursor:pointer; border-radius:8px; user-select:none}
  .pos:hover{background:var(--surface)}
  .pos:first-child{border-top:none}
  .pos .nm{flex:1; min-width:0}
  .pos .nm b{font-weight:800}
  .pos .nm small{color:var(--sub); font-weight:600; display:block; font-size:11px}
  .pos .rt{text-align:right}
  .pos .rt b{font-weight:800}
  .pos .rt small{color:var(--sub); font-weight:600; display:block; font-size:11px}
  .empty{font-size:12px; color:var(--sub2); font-weight:600; text-align:center; padding:14px 0}
  .riskline{
    margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--bg); border:1px solid var(--line);
  }
  .riskline .kv b{font-size:14px}
  .nostop{font-size:11px; font-weight:700; color:var(--warn); margin-top:5px}

  /* 멘토 */
  .mtwho{font-size:11px; font-weight:600; color:var(--sub2); line-height:1.5; margin:-4px 0 7px}
  .mtline{font-size:12.5px; font-weight:700; color:var(--accent); margin-bottom:9px; letter-spacing:-.2px}
  .mission{display:flex; gap:7px; align-items:flex-start; padding:5px 0; font-size:11.5px; line-height:1.4}
  .mission .mk{width:14px; flex:0 0 14px; font-weight:800; text-align:center; color:var(--sub2)}
  .mission .mb{flex:1; font-weight:600; color:var(--sub)}
  .mission .mv{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--sub2)}
  .mission.done .mk{color:var(--good)} .mission.done .mb{color:var(--text)} .mission.done .mv{color:var(--good)}

  .mtrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
  .mtrow:first-child{border-top:none}
  .mtrow .mtn{flex:1} .mtrow .mtn b{font-weight:800; font-size:13px}
  .mtrow .mtn small{display:block; font-size:11px; color:var(--sub); font-weight:600}
  .mtscore{font-size:15px; font-weight:800}

  /* 인트로 */
  .introrow{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line);
            font-size:13.5px; font-weight:600; color:var(--sub); line-height:1.6}
  .introrow span{font-size:20px; flex:0 0 26px; text-align:center}
  .introrow b{color:var(--text); font-weight:800}
  .keys{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
  .keys span{background:var(--surface); border-radius:8px; padding:7px 11px; font-size:12px; font-weight:600; color:var(--sub)}
  .keys b{color:var(--text); font-weight:800}

  /* 툴팁 — 스크롤 컨테이너에 잘리지 않도록 body에 띄운다 */
  [data-tip]{cursor:help; border-bottom:1px dotted var(--sub2)}
  #tip{
    position:fixed; z-index:200; max-width:250px; background:#2b3138; color:#fff;
    font-size:12px; font-weight:600; line-height:1.55; padding:9px 11px; border-radius:9px;
    pointer-events:none; opacity:0; transition:opacity .12s; box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  #tip.on{opacity:1}

  .trev{border:1px solid var(--line); border-radius:11px; padding:11px 13px; margin-bottom:8px}
  .trev .th{display:flex; align-items:baseline; gap:8px; margin-bottom:6px}
  .trev .th b{font-weight:800; font-size:13px}
  .trev .th .rt{margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums}
  .trev .th small{font-size:11px; color:var(--sub); font-weight:600}
  .trev ul{list-style:none; font-size:11.5px; font-weight:600; line-height:1.7}
  .trev li.g{color:var(--good)} .trev li.b{color:var(--up)}
  .trev li:before{content:'· '; opacity:.6}

  /* 멘토 배지 · 팝오버 */
  .mtBadge{
    display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:8px;
    background:var(--surface); font-size:12px; font-weight:700; color:var(--sub);
  }
  .mtBadge:hover{background:var(--line)}
  .mtBadge b{font-size:11.5px; font-weight:800; color:var(--sub2); font-variant-numeric:tabular-nums}
  .mtBadge.on{background:var(--accent-weak); color:var(--accent)}
  .mtBadge.on b{color:var(--accent)}
  #mtPop{
    position:fixed; z-index:120; width:290px; background:var(--bg); border:1px solid var(--line);
    border-radius:14px; padding:14px; box-shadow:0 10px 34px rgba(0,0,0,.14);
  }
  .mtpHead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px}
  .mtpHead b{font-size:14px; font-weight:800}
  .mtpHead span{font-size:11.5px; font-weight:700; color:var(--sub2)}
  .mtpNote{font-size:11px; font-weight:600; color:var(--sub2); line-height:1.5; margin-top:9px;
           padding-top:9px; border-top:1px solid var(--line)}

  /* 차트 헤더 주문 버튼 · 손절 칩 */
  .chead{display:flex; align-items:flex-start; gap:12px}
  .cheadL{flex:1; min-width:0}
  .cheadR{display:flex; gap:6px; flex:0 0 auto}
  .minibtn{padding:9px 18px; border-radius:10px; font-size:13.5px; font-weight:800; color:#fff}
  .minibtn.buy{background:var(--up)} .minibtn.sell{background:var(--down)}
  .minibtn:disabled{background:var(--line); color:var(--sub2); cursor:not-allowed}
  .stopChip{
    position:absolute; top:12px; right:80px; display:flex; align-items:center; gap:6px;
    background:#fff0f1; border:1px solid #ffd4d8; border-radius:9px; padding:4px 5px 4px 9px;
    font-size:11px; font-weight:700; color:var(--up); z-index:5;
  }
  .stopChip b{font-size:12px; font-weight:800}
  .stopChip em{font-style:normal; color:#d9737c}
  .stopChip button{width:18px; height:18px; border-radius:5px; color:var(--up); font-size:11px; line-height:1}
  .stopChip button:hover{background:#ffd4d8}

  /* 우측 주문 버튼 */
  .orderBtns{display:flex; gap:8px}
  .orderBtns .bigbtn{flex:1; display:flex; align-items:center; justify-content:center; gap:7px}
  kbd{
    font-family:inherit; font-size:10px; font-weight:800; padding:2px 5px; border-radius:4px;
    background:rgba(255,255,255,.25); letter-spacing:.3px;
  }

  /* 주문 팝업 */
  .omodal{
    background:var(--bg); border-radius:18px; width:100%; max-width:380px;
    max-height:calc(100vh - 32px); display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .ohead{display:flex; align-items:center; padding:18px 18px 12px; border-bottom:1px solid var(--line)}
  .ohead h2{flex:1; font-size:18px; font-weight:800; letter-spacing:-.5px}
  .oclose{width:28px; height:28px; border-radius:8px; color:var(--sub); font-size:14px}
  .oclose:hover{background:var(--surface)}
  .obody{padding:14px 18px 4px; overflow-y:auto; flex:1}
  .oline{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; font-size:13px}
  .oline span{color:var(--sub); font-weight:600}
  .oline b{font-weight:800; font-size:14px}
  .oline.big b{font-size:19px; letter-spacing:-.5px}
  .oline.hi{padding:9px 0}
  .oline.hi b{font-size:16px}
  .odiv{height:1px; background:var(--line); margin:10px 0}
  .obox{background:var(--surface2); border-radius:11px; padding:10px 12px; margin-bottom:12px}
  .olabel{font-size:12px; font-weight:800; color:var(--sub); margin:14px 0 8px}
  .opct{display:flex; gap:5px; margin-bottom:9px}
  .opct button{flex:1; padding:9px 0; border-radius:9px; background:var(--surface); font-size:12.5px; font-weight:700; color:var(--sub)}
  .opct button:hover{background:var(--line)}
  .opct button.on{background:var(--accent); color:#fff}
  .oqtyrow{display:flex; align-items:center; gap:8px}
  .oqty{
    flex:1; padding:13px 14px; border-radius:11px; border:1px solid var(--line);
    font-size:20px; font-weight:800; text-align:right; background:var(--bg); outline:none;
  }
  .oqty:focus{border-color:var(--accent)}
  .ounit{font-size:14px; font-weight:700; color:var(--sub)}
  .oarrow{color:var(--sub2); font-weight:700; margin:0 5px}
  .owarn{background:#fff8e1; border-radius:10px; padding:10px 12px; font-size:12px;
         font-weight:700; color:#8a6d1f; line-height:1.5; margin-top:10px}
  .owarn.hot{background:#fff0f1; color:var(--up)}
  .ofoot{display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--line)}
  .ofoot button{padding:14px 0; border-radius:11px; font-size:15px; font-weight:800}
  .oghost{flex:0 0 96px; background:var(--surface); color:var(--text)}
  .ogo{flex:1; color:#fff}
  .ogo.buy{background:var(--up)} .ogo.sell{background:var(--down)}
  .ogo:disabled{background:var(--line); color:var(--sub2); cursor:not-allowed}

  /* 팝업 안 손절선 서랍 */
  .odrawer{margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
  .odtoggle{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:800; color:var(--sub)}
  .odtoggle:hover{color:var(--text)}
  .odtoggle i{font-style:normal; font-size:10px; transition:transform .15s}
  .odtoggle.open i{transform:rotate(90deg)}
  .odbody{padding-top:11px}
  .odhint{font-size:11.5px; font-weight:600; color:var(--sub2); line-height:1.5; margin-bottom:9px}

  /* 주문 */
  .ordtabs{display:flex; background:var(--surface); border-radius:10px; padding:3px; gap:3px; margin-bottom:11px}
  .ordtabs button{flex:1; padding:8px 0; border-radius:8px; font-size:13px; font-weight:800; color:var(--sub)}
  .ordtabs button.on{background:var(--bg); box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .ordtabs button.on[data-side=buy]{color:var(--up)}
  .ordtabs button.on[data-side=sell]{color:var(--down)}
  .pctlabel{font-size:11.5px; font-weight:700; color:var(--sub); margin-bottom:6px}
  .qtyrow{display:flex; gap:5px; margin-bottom:8px}
  .qtyrow button{flex:1; padding:7px 0; border-radius:8px; background:var(--surface); font-size:11.5px; font-weight:700; color:var(--sub)}
  .qtyrow button:hover{background:var(--line)}
  .qtyin{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:16px; font-weight:800; text-align:right; background:var(--bg); outline:none;
  }
  .qtyin:focus{border-color:var(--accent)}
  .hint{font-size:11.5px; color:var(--sub); font-weight:600; margin:7px 2px 10px; line-height:1.5}
  .hint b{color:var(--accent); font-weight:800}
  .bigbtn{width:100%; padding:14px 0; border-radius:11px; font-size:15px; font-weight:800; color:#fff}
  .bigbtn.buy{background:var(--up)} .bigbtn.sell{background:var(--down)}
  .bigbtn:disabled{background:var(--line); color:var(--sub2); cursor:not-allowed}
  .pending{background:#fff8e1; border-radius:10px; padding:9px 12px; font-size:12px; font-weight:700; color:#8a6d1f; margin-bottom:10px}
  .riskrow{display:flex; gap:5px; margin-bottom:8px}
  .riskrow button{flex:1; padding:6px 0; border-radius:8px; background:var(--surface); font-size:11.5px; font-weight:700; color:var(--sub)}
  .riskrow button.on{background:var(--accent); color:#fff}

  #loading{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
           font-size:15px; font-weight:700; color:var(--sub); flex-direction:column; gap:12px; text-align:center; line-height:1.7}
  code{background:var(--surface); padding:3px 7px; border-radius:5px; font-size:12.5px; color:var(--text)}
  [hidden]{display:none !important}

  /* ─── 모달 (엔딩 리포트 · 리더보드 · 이어하기) : 모바일에서도 읽히도록 ─── */
  .scrim{position:fixed; inset:0; background:rgba(15,20,28,.55); z-index:100;
         display:flex; align-items:center; justify-content:center; padding:16px}
  .modal{
    background:var(--bg); border-radius:18px; width:100%; max-width:720px;
    max-height:calc(100vh - 32px); display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .mhead{padding:20px 22px 14px; border-bottom:1px solid var(--line)}
  .mhead h2{font-size:20px; font-weight:800; letter-spacing:-.5px}
  .mhead p{font-size:13px; font-weight:600; color:var(--sub); margin-top:4px}
  .mtabs{display:flex; gap:4px; padding:10px 18px 0}
  .mtabs button{padding:7px 14px; border-radius:9px; font-size:13px; font-weight:800; color:var(--sub)}
  .mtabs button.on{background:var(--surface); color:var(--text)}
  .mbody{overflow-y:auto; padding:16px 22px 20px; flex:1; -webkit-overflow-scrolling:touch}

<script>
'use strict';

/* ══════════════════════════════ 상수 */
const FEE = 0.001, SLIP = 0.0015;
const START_CASH = 10_000_000;
const BARS_PER_SEC = { 1: 4, 3: 12, 10: 40 };
const VIEW_TAU = 0.085;          // 화면 보간 시정수(초). 작을수록 빠르게 따라붙는다
const SCALE_TAU = 0.20;          // y축 스케일 보간 시정수
const PALETTE = ['#3182f6', '#f04452', '#ff9f0a', '#15c47e', '#8b5cf6',
                 '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#64748b'];
const DEBUG = new URLSearchParams(location.search).has('debug');

// 매 판 유형 쿼터 — 승자군·패자군·방어주가 반드시 섞이게 한다
const ARCH_WIN  = ['폭발형', '우상향형'];
const ARCH_LOSE = ['붕괴형', '쇠퇴형'];
const ARCH_DEF  = ['방어형'];

/* ══════════════════════════════ 상태 */
let D = null;
let day = 0;                     // 논리 시간 (체결·손절·벤치마크는 전부 이걸 쓴다)
let viewDay = 0;                 // 표시 시간 (차트·숫자는 이걸 쓴다). day를 부드럽게 따라간다
let speed = 0, sel = 0, visN = 250;
let useOverlay = true, showGhost = false, showReal = false, smooth = true;

/* 자동 정지 — 사유별로 끄고 켠다. 껐는데도 멈추면 기능이 없는 것과 같다 */
let autoPause = true;
let pauseOpt = { stop: true, high: true, ma200: true, gap: true, era: true, split: true };
let pauseCd = 20;                // 같은 종목·같은 사유의 재알림 간격(거래일)

let cash = START_CASH;
let pos = {}, stops = {}, pending = null, trades = [];
let riskPct = 1;
let everUsedStop = false;      // 손절선을 한 번이라도 써본 사람에게만 관련 경고를 띄운다
let peakEquity = START_CASH, mdd = 0;
let pauseMsg = '';
let pauseCool = {};              // `종목:사유` → 이 날짜까지는 같은 사유로 다시 정지하지 않는다

/**
 * 종목 가명 풀. 전부 4자 의태어다.
 * 이름이 성과를 암시하면("떡상전자") 차트를 안 보고 그걸 사버려서 익명화가 무너진다.
 * 아무 의미 없는 이름이어야 캔들과 거래량만 보게 된다.
 */
const NAME_POOL = [
  '흐지부지', '얼렁뚱땅', '갈팡질팡', '우물쭈물', '오락가락', '티격태격',
  '옥신각신', '아슬아슬', '뒤죽박죽', '두근두근', '싱글벙글', '흔들흔들',
  '알쏭달쏭', '그럭저럭', '옹기종기', '아기자기', '오순도순', '알콩달콩',
  '시끌벅적', '왁자지껄', '우당탕탕', '허둥지둥', '부랴부랴', '조마조마',
];
let runSeed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
let names = {}, colors = {};
let busy = false;                // 새 판 로딩 중 중복 클릭 방지

/* ══════════════════════════════ 유틸 */
const $ = (id) => document.getElementById(id);
const won = (v) => Math.round(v).toLocaleString('ko-KR');
const pct = (v) => (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + '%';
const cls = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// raw는 디버그 빌드에만 있으므로 없으면 조용히 ovl로 떨어진다
const series = (s) => (useOverlay ? s.ovl : s.raw || s.ovl);
const ghost  = (s) => (useOverlay ? s.raw || s.ovl : s.ovl);
const dvOf   = (s) => series(s).divAt[day];
const DV     = () => dvOf(D.stocks[sel]);

/** 워밍업(과거 1년)을 뺀 플레이 기준 날짜. 워밍업 구간은 "상장 이전"으로 표시한다 */
function gameDate(t) {
  const p = Math.min(t, D.meta.totalDays - 1) - WARMUP;
  if (p < 0) return '개장 전';
  const y = Math.floor(p / D.meta.daysPerYear) + 1;
  const m = Math.floor((p % D.meta.daysPerYear) / (D.meta.daysPerYear / 12)) + 1;
  return `${y}년차 ${m}월`;
}
const eraAt = (t) => D.eras.find((e) => t >= e.a && t < e.b) || D.eras[D.eras.length - 1];

/* ── 표시용 시세 ──
 * 화면의 모든 숫자와 차트는 viewDay 기준이다. 정지하면 viewDay가 day로 수렴해 정확해진다.
 * 진행 중에는 현재 봉이 시가에서 종가로 자라는 중간값을 보여줘 시세가 스르륵 움직인다.
 */
/**
 * 화면상 "자라고 있는 봉"과 그 진행도.
 *   viewDay = t 는 "봉 ceil(t) 가 (t - ceil(t) + 1) 만큼 진행된 상태"를 뜻한다.
 *   viewDay 가 정수 d 이면 봉 d 가 100% 완성된 상태 = 종가.
 */
function viewBar() {
  const vb = clamp(Math.ceil(viewDay - 1e-9), 0, day);
  const f = smooth ? clamp(viewDay - vb + 1, 0, 1) : 1;
  return { vb, f };
}
function dispPriceOf(st) {
  const s = series(st);
  const { vb, f } = viewBar();
  if (vb <= 0) return s.c[0];
  return s.o[vb] + (s.c[vb] - s.o[vb]) * f;
}
function dispPrevOf(st) {
  const { vb } = viewBar();
  return series(st).c[Math.max(0, vb - 1)];
}
function dispIndex() {
  const { vb, f } = viewBar();
  if (vb <= 0) return D.index[0];
  return lerp(D.index[vb - 1], D.index[vb], f);
}

function computeMA(c, n) {
  const out = new Float64Array(c.length).fill(NaN);
  let sum = 0;
  for (let i = 0; i < c.length; i++) {
    sum += c[i];
    if (i >= n) sum -= c[i - n];
    if (i >= n - 1) out[i] = sum / n;
  }
  return out;
}
function computeHH(h, n) {
  const out = new Float64Array(h.length).fill(NaN);
  const dq = [];
  for (let i = 0; i < h.length; i++) {
    while (dq.length && h[dq[dq.length - 1]] <= h[i]) dq.pop();
    dq.push(i);
    while (dq[0] <= i - n) dq.shift();
    out[i] = h[dq[0]];
  }
  return out;
}

/** 빌더가 일간 차분으로 포장한 가격 배열을 원래대로 되돌린다 (enc: 'd1') */
function unpack(k) {
  if (k.enc !== 'd1') return k;
  for (const f of ['o', 'h', 'l', 'c']) {
    const a = k[f];
    for (let i = 1; i < a.length; i++) a[i] += a[i - 1];
  }
  delete k.enc;
  return k;
}

/** 최근 n일 최저가 (단조 덱 — 구간당 O(1)) */
function computeLL(l, n) {
  const out = new Float64Array(l.length).fill(NaN);
  const dq = [];
  for (let i = 0; i < l.length; i++) {
    while (dq.length && l[dq[dq.length - 1]] >= l[i]) dq.pop();
    dq.push(i);
    while (dq[0] <= i - n) dq.shift();
    out[i] = l[dq[0]];
  }
  return out;
}

/* ══════════════════════════════ 로드 */
let MANIFEST = null, WARMUP = 250, HAS_RAW = null;

/**
 * 매 판 유니버스 추첨.
 *  · 6~10종목
 *  · 같은 종목의 다른 창을 두 개 뽑지 않는다 (한 판에 시스코가 둘 나오면 안 됨)
 *  · 유형 쿼터로 승자군 2, 패자군 2, 방어주 1을 보장 — 라운드마다 다른 교훈이 나오게
 */
function drawUniverse(all, n, rand) {
  const pool = all.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const picked = [], usedIds = new Set();
  const take = (pred, k) => {
    for (const w of pool) {
      if (picked.length >= n || k <= 0) break;
      if (usedIds.has(w.grp) || !pred(w)) continue;    // grp = 같은 실제 종목 (익명 코드)
      picked.push(w); usedIds.add(w.grp); k--;
    }
  };
  // 이미 조건을 만족한 만큼은 빼고 모자란 개수만 채운다
  const need = (pred, k) => take(pred, k - picked.filter(pred).length);

  // 교육 목적상 중요한 순서대로. 승자군·패자군·방어주가 먼저다
  need((w) => ARCH_WIN.includes(w.archetype), 2);
  need((w) => ARCH_LOSE.includes(w.archetype), 2);
  need((w) => ARCH_DEF.includes(w.archetype), 1);
  // 그다음 시장 다양성 — 한국이 한 종목도 없는 판이 나오지 않게
  // (일본은 유니버스에서 제외됨. tools/universe.mjs의 EXCLUDED_JP 참고)
  need((w) => w.mkt === 'KR', 1);
  take(() => true, n);
  return picked.slice(0, n);
}

/** 분할 일정 → 날짜별 누적배수 */
function buildDivAt(len, splits) {
  const d = new Float64Array(len);
  let div = 1, si = 0;
  for (let t = 0; t < len; t++) {
    while (si < splits.length && splits[si].day === t) { div *= splits[si].ratio; si++; }
    d[t] = div;
  }
  return d;
}

/** 새 판 — 유니버스를 다시 뽑고 창 데이터를 받아온다 */
async function startRun({ first = false, wids = null, save = null } = {}) {
  if (!first) loadNote('새 종목을 뽑는 중…');
  const rand = mulberry32(runSeed);
  const n = 6 + Math.floor(rand() * 5);                    // 6~10종목
  // 이어하기는 저장된 창을 그대로 복원한다. 순서까지 같아야 가명이 일치한다
  const picked = wids
    ? wids.map((w) => MANIFEST.windows.find((x) => x.code === w))
    : drawUniverse(MANIFEST.windows, n, rand);

  const stocks = await Promise.all(picked.map(async (w) => {
    const r = await fetch(`data/w/${w.code}.json`);
    if (!r.ok) throw new Error(`${w.code}: ${r.status}`);
    return r.json();
  }));

  for (const s of stocks) {
    for (const v of ['raw', 'ovl']) {
      const k = s[v];
      if (!k) continue;                 // raw는 ?debug=1 전용 빌드에만 들어 있다
      unpack(k);
      k.divAt = buildDivAt(k.c.length, k.splits || []);
      k.ma50 = computeMA(k.c, 50);
      k.ma200 = computeMA(k.c, 200);
      k.hh250 = computeHH(k.h, 250);
      k.ll250 = computeLL(k.l, 250);
      k.vma20 = computeMA(k.v, 20);
    }
  }
  D = { meta: MANIFEST.meta, eras: MANIFEST.eras, crashWindows: MANIFEST.crashWindows,
        index: MANIFEST.index, stocks };
  D.idxMA200 = computeMA(MANIFEST.index, 200);      // 시장 방향 판정용 (리버모어의 "대세")
  HAS_RAW = !!stocks[0].raw;
  if (DEBUG && !HAS_RAW) for (const id of ['tOverlay', 'tGhost']) $(id).hidden = true;
  colors = {};
  stocks.forEach((s, i) => { colors[s.id] = PALETTE[i % PALETTE.length]; });

  resetAccount();
  if (save) restoreAccount(save);
  buildWatchlist();
  buildPosList();
  buildMentorRows();
  if (!first) { $('loading').style.display = 'none'; resizeCanvas(); renderUI(); }
  if (!save && !localStorage.getItem(INTRO_KEY)) {
    try { localStorage.setItem(INTRO_KEY, '1'); } catch {}
    showIntro();
  }
}

/* ══════════════════════════════ 게임 루프 */
let lastT = 0, acc = 0;
function tick(ts) {
  if (!lastT) lastT = ts;
  const dt = Math.min((ts - lastT) / 1000, 0.25);
  lastT = ts;

  if (speed > 0 && day < D.meta.gameDays) {
    acc += dt * BARS_PER_SEC[speed];
    while (acc >= 1 && day < D.meta.gameDays) {
      acc -= 1;
      if (advanceDay()) { acc = 0; break; }
    }
  }

  // 표시 시간을 논리 시간 쪽으로 부드럽게 당긴다 (viewDay ≤ day 이므로 미래는 절대 안 보인다)
  if (smooth) {
    const k = 1 - Math.exp(-dt / VIEW_TAU);
    viewDay += (day - viewDay) * k;
    if (Math.abs(day - viewDay) < 0.002) viewDay = day;
  } else viewDay = day;

  renderUI();
  drawChart(dt);
  requestAnimationFrame(tick);
}

/** 하루 진행. 자동 정지가 걸리면 true */
function advanceDay() {
  const prevEra = eraAt(day).key;
  day++;
  const reasons = [];

  if (pending) {
    const st = D.stocks.find((s) => s.id === pending.id);
    const px = series(st).o[day];
    execute(pending.id, pending.side, pending.qty, px * (pending.side === 'buy' ? 1 + SLIP : 1 - SLIP), '시장가');
    pending = null;
  }

  // 정지 사유 등록. 체결·분할 같은 실제 사건은 이 함수와 무관하게 항상 일어난다
  const P = (on) => autoPause && on;
  const say = (msg, on) => { if (P(on)) reasons.push(msg); };
  // 같은 종목의 같은 사유는 쿨다운을 둔다. 강세장에서 신고가가 매일 터지면 정지가 도배된다
  const fire = (key, msg, on, mult = 1) => {
    if (!P(on)) return;
    if ((pauseCool[key] ?? -1) >= day) return;
    pauseCool[key] = day + Math.round(pauseCd * mult);
    reasons.push(msg);
  };

  // 손절 — 갭다운이면 시가, 아니면 손절가 (체결은 설정과 무관하게 일어난다)
  for (const st of D.stocks) {
    const p = pos[st.id], stop = stops[st.id];
    if (!p || !p.qty || stop == null) continue;
    const s = series(st);
    if (s.o[day] <= stop) {
      execute(st.id, 'sell', p.qty, s.o[day] * (1 - SLIP), '손절(갭)');
      delete stops[st.id];
      say(`${nameOf(st)} 손절선 이탈 — 갭하락으로 시가 체결`, pauseOpt.stop);
    } else if (s.l[day] <= stop) {
      execute(st.id, 'sell', p.qty, stop * (1 - SLIP), '손절');
      delete stops[st.id];
      say(`${nameOf(st)} 손절선에 걸려 정리했어요`, pauseOpt.stop);
    }
  }

  // 액면분할 — 내부 상태는 그대로, 표시 주식 수만 늘어난다 (알림만 옵션)
  for (const st of D.stocks) {
    const sv = series(st);
    if (sv.divAt[day] !== sv.divAt[day - 1]) {
      const r = sv.divAt[day] / sv.divAt[day - 1];
      say(`${nameOf(st)} ${r}:1 액면분할 — 보유 주식 수가 ${r}배가 됐어요`, pauseOpt.split);
    }
  }

  const era = eraAt(day);
  if (era.key !== prevEra) say(`시대가 바뀌었어요 — ${era.name}`, pauseOpt.era);
  for (const st of D.stocks) {
    const s = series(st), i = day;
    if (i < 251) continue;
    const gap = s.o[i] / s.c[i - 1] - 1;
    if (Math.abs(gap) >= 0.07)
      fire(`${st.id}:gap`, `${nameOf(st)} ${gap > 0 ? '갭상승' : '갭하락'} ${pct(gap)}`, pauseOpt.gap, 0.5);
    if (s.c[i] > s.hh250[i - 1] && s.v[i] > s.vma20[i - 1] * 2)
      fire(`${st.id}:hh`, `${nameOf(st)} 52주 신고가 돌파 — 거래량이 평소의 ${(s.v[i] / s.vma20[i - 1]).toFixed(1)}배예요`, pauseOpt.high, 1.5);
    if (pos[st.id]?.qty && s.c[i - 1] >= s.ma200[i - 1] && s.c[i] < s.ma200[i])
      fire(`${st.id}:ma200`, `${nameOf(st)} 200일선을 내줬어요`, pauseOpt.ma200, 1);
  }

  const eq = equityAt(day);
  eqPath[day] = eq;
  if (eq > peakEquity) peakEquity = eq;
  const dd = eq / peakEquity - 1;
  if (dd < mdd) mdd = dd;

  if (day >= D.meta.gameDays) { setSpeed(0); finishRun(); return true; }
  if (day % 100 === 0) saveGame();

  // 챕터 전환은 30년에 두 번뿐이라 자동정지 설정과 무관하게 항상 멈춘다
  const mNow = mentorAt(day);
  if (!ffwd && mentorAt(day - 1).key !== mNow.key) {
    setSpeed(0); saveGame(); showMentorEnd(mentorAt(day - 1), mNow);
    return true;
  }

  if (reasons.length) {
    setSpeed(0);
    pauseMsg = '<b>⏸ 정지</b> ' + reasons.slice(0, 2).join(' · ');
    saveGame();
    return true;
  }
  return false;
}

function execute(id, side_, qty, px, tag) {
  if (qty <= 0) return;
  const p = (pos[id] ||= { qty: 0, cost: 0 });
  if (side_ === 'buy') {
    const dv = series(D.stocks.find((s) => s.id === id)).divAt[day];
    if (px * qty * (1 + FEE) > cash) qty = Math.floor((cash / (px * (1 + FEE))) * dv) / dv;
    if (qty <= 0) return;
    cash -= px * qty * (1 + FEE);
    p.cost = (p.cost * p.qty + px * qty) / (p.qty + qty);
    p.qty += qty;
  } else {
    qty = Math.min(qty, p.qty);
    if (qty <= 0) return;
    cash += px * qty * (1 - FEE);
    p.qty -= qty;
    if (!p.qty) { p.cost = 0; delete stops[id]; }
  }
  trades.push({ day, id, side: side_, qty, px, tag, ...(side_ === 'buy' ? { ctx: entryContext(id) } : null) });
}

/**
 * 매수 시점의 상태를 박제한다. 세 대가가 공통으로 보라고 한 다섯 가지.
 * 나중에 다시 계산할 수도 있지만 "그때 손절선을 그었는지"는 복원이 안 되므로 지금 남긴다.
 */
function entryContext(id) {
  const st = D.stocks.find((s) => s.id === id);
  const s = series(st), i = day, c = s.c[i];
  if (i < 220) return null;
  return {
    trend: c > s.ma200[i] && s.ma200[i] > s.ma200[i - 20],    // 200일선 위 + 200일선 상승 (미너비니)
    near: c >= s.hh250[i] * 0.85,                             // 52주 고가 15% 이내 (오닐)
    vol: s.v[i] > s.vma20[i - 1] * 1.5,                       // 거래량 동반 (오닐)
    mkt: D.index[i] > D.idxMA200[i],                          // 시장이 위를 향하는가 (리버모어)
    stop: stops[id] != null,                                  // 손절선을 긋고 샀는가
    stopPct: stops[id] != null ? stops[id] / c - 1 : null,
  };
}

/* ══════════════════════════════ 계산 */
function equityAt(t) {
  let e = cash;
  for (const s of D.stocks) { const p = pos[s.id]; if (p?.qty) e += p.qty * series(s).c[t]; }
  return e;
}
function equityDisp() {
  let e = cash;
  for (const s of D.stocks) { const p = pos[s.id]; if (p?.qty) e += p.qty * dispPriceOf(s); }
  return e;
}
/* 벤치마크 기준점은 전부 워밍업이 끝난 시점(WARMUP) — 플레이어가 첫 매매를 할 수 있는 날 */
const benchIdx = () => START_CASH * (dispIndex() / D.index[WARMUP]);
function benchEW() {
  let m = 0;
  for (const s of D.stocks) m += dispPriceOf(s) / series(s).c[WARMUP];
  return START_CASH * (m / D.stocks.length);
}
let ewrPath = null, eqPath = null, ewPath = null;
/** 동일가중 B&H 경로 — "받은 종목을 그냥 다 들고 있었다면". 리더보드의 기준선이다 */
function buildEW() {
  const p = new Float64Array(D.meta.totalDays + 1).fill(START_CASH);
  for (let t = WARMUP; t <= D.meta.totalDays; t++) {
    let m = 0;
    for (const s of D.stocks) m += series(s).c[t] / series(s).c[WARMUP];
    p[t] = START_CASH * (m / D.stocks.length);
  }
  ewPath = p;
}
function buildEWR() {
  const p = new Float64Array(D.meta.totalDays + 1).fill(START_CASH);
  for (let t = WARMUP + 1; t <= D.meta.totalDays; t++) {
    let m = 0;
    for (const s of D.stocks) { const c = series(s).c; m += c[t] / c[t - 1] - 1; }
    p[t] = p[t - 1] * (1 + m / D.stocks.length);
  }
  ewrPath = p;
}
const benchEWR = () => { const { vb, f } = viewBar(); return vb <= 0 ? ewrPath[0] : lerp(ewrPath[vb - 1], ewrPath[vb], f); };

/** 지금 그어둔 손절선이 전부 걸렸을 때 잃는 금액 */
function accountRisk() {
  let amt = 0, noStop = 0;
  for (const s of D.stocks) {
    const p = pos[s.id];
    if (!p?.qty) continue;
    const stop = stops[s.id];
    if (stop == null) { noStop++; continue; }
    amt += Math.max(0, (dispPriceOf(s) - stop) * p.qty);
  }
  return { amt, noStop };
}

function setTxt(el, v, klass) {
  if (el.textContent !== v) el.textContent = v;
  if (klass !== undefined && el.className !== klass) el.className = klass;
}
/** innerHTML은 값이 실제로 바뀔 때만 쓴다. 매 프레임 재파싱하면 그 안의 노드가 계속 파괴된다 */
function setHTML(el, html) {
  if (el.__last !== html) { el.innerHTML = html; el.__last = html; }
}

function renderUI() {
  const st = D.stocks[sel], s = series(st), dv = DV();
  const { vb } = viewBar();
  const era = eraAt(vb);
  const eqNow = equityDisp();      // 관심종목 비중 표시에도 쓰이므로 먼저 구한다

  setTxt($('gdate'), gameDate(vb));
  setTxt($('era'), era.name, 'era ' + era.tone);
  const idxNow = dispIndex();
  setTxt($('idxv'), won(idxNow));
  const ic = vb > 0 ? idxNow / D.index[vb - 1] - 1 : 0;
  setTxt($('idxc'), pct(ic), 'num ' + cls(ic));

  // 종목 헤더
  const px = dispPriceOf(st), prev = dispPrevOf(st);
  const ch = prev ? px / prev - 1 : 0;
  setTxt($('sname'), nameOf(st));

  D.stocks.forEach((x, i) => {

  // 계좌

  const set = (id, v) => setTxt($(id), pct(v), 'num ' + cls(v));
  set('aIdx', eq / bi - 1);
  set('bmIdx', bi / START_CASH - 1); set('bmEwr', br / START_CASH - 1); set('bmEw', be / START_CASH - 1);

  // 포트폴리오
  let invested = 0;
  D.stocks.forEach((x, i) => {
    const p = pos[x.id], ref = posRefs[i];
    if (!p?.qty) { if (!ref.root.hidden) ref.root.hidden = true; wbarRefs[i].style.width = '0%'; return; }
    const cur = dispPriceOf(x), val = p.qty * cur, xdv = dvOf(x);

    setTxt(ref.name, nameOf(x));
    setTxt(ref.sub, `${won(p.qty * xdv)}주 · 평단 ${won(p.cost / xdv)}`);
    const plv = cur / p.cost - 1;
    setTxt(ref.pl, pct(plv), 'num ' + cls(plv));

         'num ' + (rk.amt / eq > 0.05 ? 'down' : 'flat'));

      `${won(pending.qty * dvOf(pst))}주 — 다음 날 시가에 체결돼요</div>`);

  renderStopChip();

  renderMentor();

  $('pauseLine').hidden = !pauseMsg;
  if (pauseMsg) setHTML($('pauseLine'), pauseMsg);
  setHTML($('newsTxt'), currentNews(performance.now()));
}

];

/** (판, 날짜)마다 고정된 난수. 같은 날을 다시 보면 같은 헤드라인이 나온다 */
function nrand(t, salt) {
  let h = (runSeed ^ Math.imul(t, 2654435761) ^ Math.imul(salt, 40503)) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 13;
  return (h >>> 0) / 4294967296;
}
const npick = (arr, t, salt) => arr[Math.floor(nrand(t, salt) * arr.length) % arr.length];

/** 전 종목을 훑어 가장 눈에 띄는 사건 하나를 고른다 (보유 종목이면 가중) */
function scanEvents(vb) {
  if (vb < 260) return null;
  let best = null;
  const add = (score, html) => { if (!best || score > best.score) best = { score, html }; };
  for (const st of D.stocks) {
    const s = series(st), nm = nameOf(st);
    const c = s.c[vb], ch = c / s.c[vb - 1] - 1;
    const vr = s.vma20[vb - 1] > 0 ? s.v[vb] / s.vma20[vb - 1] : 1;
    const held = pos[st.id]?.qty > 0;

    if (held && s.c[vb - 1] >= s.ma200[vb - 1] && c < s.ma200[vb])
      add(98, `<b>${nm}, 200일선을 내줬습니다</b> — 추세가 꺾이는 자리일 수 있습니다`);
    if (ch <= -0.07) add(held ? 100 : 85, `<b>${nm} 급락 ${pct(ch)}</b> — 투매 물량이 쏟아졌습니다`);
    else if (ch >= 0.07) add(held ? 88 : 82, `<b>${nm} 급등 ${pct(ch)}</b> — 매수세가 몰렸습니다`);
    if (c > s.hh250[vb - 1]) {
      if (vr >= 2) add(held ? 95 : 90, `<b>${nm}, 52주 신고가 경신</b> — 거래량이 평소의 ${vr.toFixed(1)}배입니다`);
      else add(held ? 80 : 74, `<b>${nm}, 52주 신고가</b> — 다만 거래량은 평소 수준입니다`);
    }
    if (c < s.ll250[vb - 1]) add(held ? 92 : 71, `<b>${nm}, 52주 신저가</b>입니다`);
    if (s.c[vb - 1] < s.ma200[vb - 1] && c > s.ma200[vb])
      add(69, `<b>${nm}, 200일선 회복</b> — 추세 전환을 시도합니다`);
  }
  return best;
}

/** 지금 시점의 헤드라인 후보. score가 클수록 큰 뉴스다 */
function newsCandidate(vb) {
  if (vb < 2) return { score: 50, html: '30년이 시작됩니다. 차트를 보고 직접 판단하세요.' };
  const era = eraAt(vb);
  const pool = MACRO[era.key] || MACRO._bull;
  const ic = D.index[vb] / D.index[vb - 1] - 1;

  // 1) 방금 청산한 매매 — 대가들의 기준으로 즉시 코칭
  const cc = closedCached();
  const last = cc[cc.length - 1];
  if (last && last.exitDay === vb) {
    const v = reviewTrade(last);
    const msg = v.bad[0] || v.good[0];
    if (msg) return { score: 100, html: `<b>${names[last.id]} 청산 ${pct(last.ret)}</b> — ${msg}` };
  }
  // 2) 시장 급변
  if (ic <= -0.03) return { score: 96, html: `📰 <b>지수 ${pct(ic)}.</b> ${npick(pool.down, vb, 1)}` };
  if (ic >= 0.03) return { score: 94, html: `📰 <b>지수 ${pct(ic)}.</b> ${npick(pool.up, vb, 2)}` };
  // 3) 종목 사건
  const ev = scanEvents(vb);
  if (ev) return { score: ev.score, html: `📰 ${ev.html}` };
  // 4) 시황 아니면 노이즈 — 어느 쪽인지 겉으로는 알 수 없다
  const r = nrand(vb, 3);
  if (r < 0.45) return { score: 10, html: `📰 ${npick(pool.calm, vb, 4)}` };
  if (r < 0.78) {
    const st = D.stocks[Math.floor(nrand(vb, 5) * D.stocks.length) % D.stocks.length];
    return { score: 10, html: `📰 ${npick(NOISE_STOCK, vb, 6).replace(/\{n\}/g, nameOf(st))}` };
  }
  return { score: 10, html: `📰 ${npick(NOISE_MKT, vb, 7)}` };
}

/**
 * 10배속이면 하루가 25ms다. 매일 갈아치우면 아무도 못 읽는다.
 * 헤드라인마다 최소 유지 시간을 주고, 정말 큰 뉴스만 그 시간을 무시하고 끼어들게 한다.
 */
const HOLD_BIG = 2600, HOLD_FILLER = 4200, PREEMPT = 700;
let newsHold = { html: '', score: -1, t: -1e9 };
function currentNews(now) {
  const { vb } = viewBar();
  const c = newsCandidate(vb);
  const age = now - newsHold.t;
  const minHold = newsHold.score >= 60 ? HOLD_BIG : HOLD_FILLER;
  const preempt = c.score >= 90 && c.score > newsHold.score && age >= PREEMPT;
  if (!newsHold.html || preempt || age >= minHold) newsHold = { html: c.html, score: c.score, t: now };
  return newsHold.html;
}

/* ══════════════════════════════ 주문 팝업
 * 손절선·수량 계산·주문을 한 화면에 모은다.
 * 이 세 개는 원래 하나의 판단이라 화면에서 쪼개면 초보는 연결을 못 하고 고수는 왔다갔다 한다.
 */
let ordSide = 'buy', ordQty = 0, ordPct = null, ordPrevSpeed = 0, ordStopOpen = false;
const ordOpen = () => !$('ordScrim').hidden;

/** 표시 단위(분할 반영) 기준 최대 주문 수량. 매수는 현금, 매도는 보유 수량이 한도다 */
function maxQtyFor(side_) {
  const st = D.stocks[sel], dv = DV();
  if (side_ === 'buy') return Math.floor(cash / ((dispPriceOf(st) / dv) * (1 + SLIP) * (1 + FEE)));
  return Math.floor((pos[st.id]?.qty || 0) * dv);
}

function openOrder(side_) {
  if (!D || ordOpen()) return;
  if (side_ === 'sell' && maxQtyFor('sell') <= 0) return;
  ordSide = side_; ordQty = 0; ordPct = null; ordStopOpen = false;
  ordPrevSpeed = speed;
  setSpeed(0);
  viewDay = day;                 // 팝업 안 숫자가 흔들리지 않게 표시 시간을 논리 시간에 딱 맞춘다
  $('ordScrim').hidden = false;
  renderOrder();
  setTimeout(() => $('oQty').select(), 30);
}

function closeOrder() {
  $('ordScrim').hidden = true;
  if (ordPrevSpeed > 0) setSpeed(ordPrevSpeed);
  ordPrevSpeed = 0;
}

function confirmOrder() {
  if (!ordOpen()) return;                 // 팝업이 닫힌 상태에서 확정이 불리면 무시
  const st = D.stocks[sel], dv = DV();
  const q = clamp(Math.floor(ordQty) || 0, 0, maxQtyFor(ordSide));
  if (q <= 0) return;
  pending = { id: st.id, side: ordSide, qty: q / dv };
  closeOrder();
  renderUI();
}

function setOrdQty(v, fromPct = null) {
  ordQty = clamp(Math.floor(v) || 0, 0, maxQtyFor(ordSide));
  ordPct = fromPct;
  renderOrder();
}

function renderOrder() {
  if (!ordOpen()) return;
  const st = D.stocks[sel], dv = DV(), buy = ordSide === 'buy';
  const px = dispPriceOf(st) / dv, prev = dispPrevOf(st) / dv;
  const ch = prev ? px / prev - 1 : 0;
  const maxQ = maxQtyFor(ordSide);
  const q = clamp(Math.floor(ordQty) || 0, 0, maxQ);
  const eq = equityDisp(), p = pos[st.id];
  const fill = px * (buy ? 1 + SLIP : 1 - SLIP);
  const gross = fill * q, fee = gross * FEE;

  $('oTitle').textContent = `${nameOf(st)} ${buy ? '매수' : '매도'}`;
  setHTML($('oPx'), `${won(px)}원 <span class="${cls(ch)}" style="font-size:13px">` +
    `${ch >= 0 ? '▲' : '▼'} ${pct(ch)}</span>`);

  // 매도는 "내가 뭘 갖고 있는지"부터 보여줘야 판단이 된다
  if (buy) setHTML($('oHold'), '');
  else {
    const held = Math.floor((p?.qty || 0) * dv), avg = p?.qty ? p.cost / dv : 0;
    const plv = avg ? px / avg - 1 : 0, plAmt = (px - avg) * held;
    setHTML($('oHold'),
      `<div class="obox" style="margin-top:10px">
         <div class="oline"><span>보유 수량</span><b class="num">${won(held)}주</b></div>
         <div class="oline"><span>평균 단가</span><b class="num">${won(avg)}원</b></div>
         <div class="oline"><span>평가 손익</span><b class="num ${cls(plv)}">
           ${plAmt >= 0 ? '+' : ''}${won(plAmt)}원 (${pct(plv)})</b></div>
       </div>`);
  }

  setTxt($('oQLabel'), buy ? '얼마나 살까요?' : '얼마나 팔까요?');
  const opts = buy ? [[10, '10%'], [25, '25%'], [50, '50%'], [100, '최대']]
                   : [[25, '25%'], [50, '50%'], [100, '전량']];
  setHTML($('oPct'), opts.map(([v, l]) =>
    `<button data-pct="${v}" class="${ordPct === v ? 'on' : ''}">${l}</button>`).join(''));
  if ($('oQty').value !== String(q)) $('oQty').value = q;

  if (q <= 0) {
    setHTML($('oCalc'), `<div class="odiv"></div><div class="oline"><span>${
      buy ? `현금 ${won(cash)}원으로 최대 ${won(maxQ)}주` : `보유 ${won(maxQ)}주`}</span><b></b></div>`);
  } else if (buy) {
    const curVal = (p?.qty || 0) * dispPriceOf(st);
    const wNow = eq > 0 ? curVal / eq : 0, wAfter = eq > 0 ? (curVal + gross) / eq : 0;
    setHTML($('oCalc'),
      `<div class="odiv"></div>
       <div class="oline"><span>예상 체결가</span><b class="num">${won(fill)}원</b></div>
       <div class="oline"><span>주문 금액</span><b class="num">${won(gross)}원</b></div>
       <div class="oline"><span>수수료</span><b class="num">${won(fee)}원</b></div>
       <div class="odiv"></div>
       <div class="oline hi"><span>내 현금</span><b class="num">${won(cash)}<span class="oarrow">→</span>${won(cash - gross - fee)}원</b></div>
       <div class="oline hi"><span>이 종목 비중</span><b class="num">${(wNow * 100).toFixed(0)}%<span class="oarrow">→</span><span class="${wAfter >= 0.5 ? 'up' : ''}">${(wAfter * 100).toFixed(0)}%</span></b></div>`);
    // 몰빵을 막지는 않는다. 다만 무슨 짓을 하는 중인지는 숫자로 보여준다
    const warn = $('oWarn');
    warn.hidden = wAfter < 0.35;
    warn.className = 'owarn' + (wAfter >= 0.5 ? ' hot' : '');
    if (!warn.hidden) warn.textContent =
      `한 종목에 자산의 ${(wAfter * 100).toFixed(0)}%가 들어갑니다. ` +
      `이 종목이 반토막 나면 전체 자산이 ${(wAfter * 50).toFixed(0)}% 줄어요.`;
  } else {
    const avg = p?.qty ? p.cost / dv : 0;
    const net = gross - fee, realized = net - avg * q;
    setHTML($('oCalc'),
      `<div class="odiv"></div>
       <div class="oline"><span>예상 체결가</span><b class="num">${won(fill)}원</b></div>
       <div class="oline"><span>예상 수령액</span><b class="num">${won(net)}원</b></div>
       <div class="oline hi"><span>실현 손익</span><b class="num ${cls(realized)}">${realized >= 0 ? '+' : ''}${won(realized)}원</b></div>
       <div class="odiv"></div>
       <div class="oline hi"><span>내 현금</span><b class="num">${won(cash)}<span class="oarrow">→</span>${won(cash + net)}원</b></div>
       <div class="oline"><span>남는 수량</span><b class="num">${won(maxQ)}<span class="oarrow">→</span>${won(maxQ - q)}주</b></div>`);
    $('oWarn').hidden = true;
  }

  setHTML($('oStopBox'), buy ? stopDrawerHtml(st, dv, px, eq) : '');

  const go = $('oGo');
  go.className = 'ogo ' + ordSide;
  go.textContent = buy ? '매수하기' : '매도하기';
  go.disabled = q <= 0;
}

/** 손절선 + 포지션 사이징. 기본 접힘 — 초보는 안 펼치면 그만이다 */
function stopDrawerHtml(st, dv, px, eq) {
  const stop = stops[st.id];
  const head = `<button class="odtoggle ${ordStopOpen ? 'open' : ''}" id="odT"><i>▶</i> 손절선 정하기 ` +
    `<span style="font-weight:600;color:var(--sub2)">(선택)</span></button>`;
  if (!ordStopOpen) return `<div class="odrawer">${head}</div>`;

  const sd = stop != null ? stop / dv : null;
  const gap = sd != null ? sd / px - 1 : null;
  const per = sd != null ? px - sd : 0;
  const qty = per > 0 ? Math.floor(eq * (riskPct / 100) / per) : 0;
  return `<div class="odrawer">${head}
    <div class="odbody">
      <div class="odhint">여기까지 떨어지면 자동으로 팔립니다. 최대 손실을 먼저 정하면 살 수량이 자동으로 계산돼요.</div>
      <div class="oqtyrow" style="margin-bottom:9px">
        <input class="oqty num" id="oStopIn" type="number" min="0" step="1"
               placeholder="손절가" value="${sd != null ? Math.round(sd) : ''}">
        <span class="ounit">원</span>
      </div>
      ${gap != null ? `<div class="oline"><span>현재가 대비</span><b class="num ${cls(gap)}">${pct(gap)}</b></div>` : ''}
      <div class="olabel" style="margin:12px 0 8px">최대 얼마까지 잃어도 될까요?</div>
      <div class="opct" id="oRisk">${[0.5, 1, 2, 3].map((v) =>
        `<button data-r="${v}" class="${riskPct === v ? 'on' : ''}">${v}%</button>`).join('')}</div>
      <div class="oline hi"><span>이만큼 사면 됩니다</span><b class="num">${
        per > 0 ? `${won(qty)}주` : '손절가를 현재가보다 낮게'}</b></div>
      ${per > 0 ? `<div class="opct" style="margin-top:4px"><button id="oApplyRisk">이 수량으로 채우기</button></div>` : ''}
    </div></div>`;
}

/** 차트 우상단 손절선 칩 */
function renderStopChip() {
  const st = D.stocks[sel], stop = stops[st.id], chip = $('stopChip');
  if (stop == null) { chip.hidden = true; return; }
  chip.hidden = false;
  const d = stop / dispPriceOf(st) - 1;
  setTxt($('stopChipP'), won(stop / DV()) + '원');
  setTxt($('stopChipPct'), pct(d));
}

/* ══════════════════════════════ 차트 */
const cv = $('cv');
const ctx = cv.getContext('2d');
let dragStop = false, plot = null;
let viewL0 = null, viewL1 = null, snapScale = true;

function resizeCanvas() {
  const r = cv.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.floor(r.width * dpr));
  cv.height = Math.max(1, Math.floor(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  snapScale = true;
}
window.addEventListener('resize', resizeCanvas);

function drawChart(dt) {
  if (!D) return;
  // 컨테이너 크기가 캔버스와 어긋나면 다시 잡는다 (스크롤바 출현 등 resize 이벤트 없는 변화 대비)
  const box = cv.parentElement.getBoundingClientRect();
  if (box.width > 0 && Math.abs(box.width - cv.clientWidth) > 1) resizeCanvas();
  const W = cv.clientWidth, H = cv.clientHeight;
  if (W < 50 || H < 50) return;
  const st = D.stocks[sel], s = series(st), g = ghost(st), dv = DV();
  const PADR = 62, PADL = 8, PADT = 10, PADB = 6;
  const volH = Math.round(H * 0.2);
  const priceH = H - volH - PADT - PADB - 10;
  const right = W - PADR;

  ctx.clearRect(0, 0, W, H);

  const { vb, f: frac } = viewBar();             // 자라고 있는 봉과 진행도
  const vd = vb - 1 + frac;                      // 서브픽셀 스크롤용 연속 위치
  const i0 = Math.max(0, vb - visN + 1);
  const cw = (W - PADL - PADR) / visN;

  /* y 범위: 보이는 구간 + vb까지만. 미래는 절대 참조하지 않는다 */
  let lo = Infinity, hi = -Infinity, vmax = 0;
  for (let i = i0; i <= vb; i++) {
    if (s.l[i] < lo) lo = s.l[i];
    if (s.h[i] > hi) hi = s.h[i];
    if (s.v[i] > vmax) vmax = s.v[i];
    if (showGhost) { if (g.c[i] < lo) lo = g.c[i]; if (g.c[i] > hi) hi = g.c[i]; }
  }
  for (const ma of [s.ma50, s.ma200]) {
    for (let i = i0; i <= vb; i++) {
      const v = ma[i];
      if (!isNaN(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
    }
  }
  const stop = stops[st.id];
  if (stop != null) { lo = Math.min(lo, stop); hi = Math.max(hi, stop); }
  if (!isFinite(lo) || !isFinite(hi) || lo <= 0) { lo = 1; hi = 2; }
  const pad = (Math.log(hi) - Math.log(lo)) * 0.06 || 0.02;
  const tL0 = Math.log(lo) - pad, tL1 = Math.log(hi) + pad;

  /* y축 스케일 보간 — 신고가가 나올 때마다 차트 전체가 출렁이는 것을 없앤다 */
  if (snapScale || viewL0 === null || !smooth) { viewL0 = tL0; viewL1 = tL1; snapScale = false; }
  else {
    const k = 1 - Math.exp(-(dt || 0.016) / SCALE_TAU);
    viewL0 = lerp(viewL0, tL0, k);
    viewL1 = lerp(viewL1, tL1, k);
  }
  const L0 = viewL0, L1 = viewL1;

  // 서브픽셀 연속 스크롤: 봉 vd가 항상 우측 끝에 오도록
  const X = (i) => right - (vd - i) * cw;
  const Y = (p) => PADT + priceH * (1 - (Math.log(p) - L0) / (L1 - L0));
  const invY = (y) => Math.exp(L0 + (1 - (y - PADT) / priceH) * (L1 - L0));
  plot = { X, Y, invY, PADT, priceH };

  // 가격축
  ctx.font = '600 10.5px -apple-system,Segoe UI,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let k = 0; k <= 5; k++) {
    const p = Math.exp(L0 + (L1 - L0) * (k / 5)), y = Y(p);
    ctx.strokeStyle = '#f2f4f6'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PADL, y + .5); ctx.lineTo(right, y + .5); ctx.stroke();
    ctx.fillStyle = '#b0b8c1';
    ctx.fillText(won(p / dv), right + 6, y);
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(PADL, 0, right - PADL, H); ctx.clip();

  // 거래량
  const volTop = PADT + priceH + 10;
  for (let i = i0; i <= vb; i++) {
    const grow = i === vb ? frac : 1;
    const h = vmax ? (s.v[i] / vmax) * volH * grow : 0;
    ctx.fillStyle = s.c[i] >= s.o[i] ? 'rgba(240,68,82,.28)' : 'rgba(49,130,246,.28)';
    ctx.fillRect(X(i) - cw * 0.35, volTop + volH - h, Math.max(1, cw * 0.7), h);
  }

  // 비교선 (디버그)
  if (showGhost) {
    ctx.strokeStyle = 'rgba(139,149,161,.55)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = i0; i <= vb; i++) (i === i0 ? ctx.moveTo : ctx.lineTo).call(ctx, X(i), Y(g.c[i]));
    ctx.stroke();
  }

  // 이동평균
  for (const [ma, col] of [[s.ma200, '#b0b8c1'], [s.ma50, '#ff9f0a']]) {
    ctx.strokeStyle = col; ctx.lineWidth = 1.4;
    ctx.beginPath(); let started = false;
    for (let i = i0; i <= vb; i++) {
      const v = ma[i]; if (isNaN(v)) continue;
      if (!started) { ctx.moveTo(X(i), Y(v)); started = true; } else ctx.lineTo(X(i), Y(v));
    }
    ctx.stroke();
  }

  // 캔들 (한국식: 상승 빨강 / 하락 파랑)
  const bw = Math.max(1, cw * 0.68);
  const thin = cw < 1.2;                        // 봉이 1px 미만이면 선으로 그린다
  for (let i = i0; i <= vb; i++) {
    let o = s.o[i], h = s.h[i], l = s.l[i], c = s.c[i];
    if (i === vb && smooth && frac < 1) {
      // 마지막 봉은 시가에서 시작해 고가/저가로 벌어지며 종가로 수렴한다
      c = o + (c - o) * frac; h = o + (h - o) * frac; l = o + (l - o) * frac;
    }
    const col = c >= o ? '#f04452' : '#3182f6';
    const x = X(i);
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.lineWidth = thin ? Math.max(0.7, cw) : Math.min(1.2, Math.max(0.6, cw * 0.1));
    ctx.beginPath(); ctx.moveTo(x, Y(h)); ctx.lineTo(x, Y(l)); ctx.stroke();
    if (!thin) {
      const y1 = Y(Math.max(o, c)), y2 = Y(Math.min(o, c));
      ctx.fillRect(x - bw / 2, y1, bw, Math.max(1, y2 - y1));
    }
  }

  // 내 매매 자국 — 어디서 사고 팔았는지 차트에 남는다
  for (const t of trades) {
    if (t.id !== st.id || t.day < i0 || t.day > vb) continue;
    const x = X(t.day), buy = t.side === 'buy';
    const yy = Y(t.px) + (buy ? 13 : -13);
    ctx.fillStyle = buy ? '#f04452' : (t.tag || '').startsWith('손절') ? '#8b5cf6' : '#3182f6';
    ctx.beginPath();
    if (buy) { ctx.moveTo(x, yy - 7); ctx.lineTo(x - 5, yy + 2); ctx.lineTo(x + 5, yy + 2); }
    else { ctx.moveTo(x, yy + 7); ctx.lineTo(x - 5, yy - 2); ctx.lineTo(x + 5, yy - 2); }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 평단선
  const p = pos[st.id];
  if (p?.qty) {
    const y = Y(p.cost);
    ctx.strokeStyle = '#15c47e'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(PADL, y); ctx.lineTo(right, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#15c47e'; ctx.textAlign = 'right';
    ctx.fillText('평단 ' + won(p.cost / dv), right - 4, y - 7);
    ctx.textAlign = 'left';
  }

  // 손절선
  if (stop != null) {
    const y = Y(stop);
    ctx.strokeStyle = '#f04452'; ctx.lineWidth = 1.6; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(PADL, y); ctx.lineTo(right, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#f04452'; ctx.fillRect(right, y - 8, PADR, 16);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText('손절 ' + won(stop / dv), right + PADR / 2, y);
    ctx.textAlign = 'left';
  }
}

/* 손절선 드래그 */
cv.addEventListener('pointerdown', (e) => { dragStop = true; cv.setPointerCapture(e.pointerId); setStopFromMouse(e); });
cv.addEventListener('pointermove', (e) => { if (dragStop) setStopFromMouse(e); });
cv.addEventListener('pointerup', () => { dragStop = false; });
function setStopFromMouse(e) {
  if (!plot) return;
  const r = cv.getBoundingClientRect();
  const y = e.clientY - r.top;
  if (y < plot.PADT || y > plot.PADT + plot.priceH) return;
  stops[D.stocks[sel].id] = plot.invY(y);
  everUsedStop = true;
  renderStopChip();
  renderOrder();
}

/* ══════════════════════════════ UI */
function setSpeed(s) {
  if (s === 0) newsHold.t = -1e9;      // 멈추면 그날 헤드라인을 바로 보여준다
  if (s > 0) pauseMsg = '';
  speed = s;
  [...$('speed').children].forEach((b) => b.classList.toggle('on', +b.dataset.s === s));
}
/** 자동 정지 설정 → 화면 반영. 상태와 버튼 표시가 어긋나지 않도록 항상 여기서만 그린다 */
function syncPauseUI() {
  const on = Object.values(pauseOpt).filter(Boolean).length;
  const live = autoPause && on > 0;
  const btn = $('tPause');
  btn.classList.toggle('on', live);
  $('pauseN').textContent = live ? on : '끔';
  $('pMaster').checked = autoPause;
  for (const el of $('pausePop').querySelectorAll('input[data-p]')) {
    el.checked = pauseOpt[el.dataset.p];
    el.disabled = !autoPause;
    el.closest('.poprow').classList.toggle('dim', !autoPause);
  }
  [...$('pCd').children].forEach((b) => b.classList.toggle('on', +b.dataset.cd === pauseCd));
}


/** [data-tip] 위에 마우스를 올리면 설명을 띄운다. 스크롤 컨테이너에 잘리지 않게 body에 고정 배치한다 */
function bindTooltips() {
  const tip = $('tip');
  let cur = null;
  document.addEventListener('pointerover', (e) => {
    const el = e.target.closest?.('[data-tip]');
    if (el === cur) return;
    cur = el;
    if (!el) { tip.classList.remove('on'); return; }
    tip.textContent = el.dataset.tip;
    tip.classList.add('on');
    const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
    let x = r.left + r.width / 2 - t.width / 2;
    let y = r.top - t.height - 8;
    if (y < 6) y = r.bottom + 8;                                   // 위가 좁으면 아래로
    tip.style.left = `${clamp(x, 8, innerWidth - t.width - 8)}px`;
    tip.style.top = `${y}px`;
  });
  document.addEventListener('pointerdown', () => { cur = null; tip.classList.remove('on'); });
}

const mentorAt = (t) => {
  const y = (t - WARMUP) / D.meta.daysPerYear;
  return MENTORS.find((m) => y >= m.a && y < m.b) || MENTORS[MENTORS.length - 1];
};

let _ctCache = null, _ctLen = -1;
function closedCached() {
  if (_ctLen !== trades.length) { _ctCache = closedTrades(); _ctLen = trades.length; }
  return _ctCache;
}

function mentorStats(m) {
  const DPY = D.meta.daysPerYear;
  const a = WARMUP + m.a * DPY;
  const b = Math.min(WARMUP + m.b * DPY, D.meta.gameDays);
  const upto = Math.min(day, b);
  const buys = trades.filter((t) => t.side === 'buy' && t.day >= a && t.day <= upto && t.ctx);
  const closed = closedCached().filter((c) => c.exitDay >= a && c.exitDay <= upto);
  let peak = eqPath[a] || START_CASH, dd = 0;
  for (let t = a; t <= upto; t++) {
    if (eqPath[t] > peak) peak = eqPath[t];
    const d = eqPath[t] / peak - 1;
    if (d < dd) dd = d;
  }
  return { m, a, b, upto, buys, closed, losses: closed.filter((c) => c.pnl <= 0), mdd: dd, ts: tradeStats(closed) };
}

function evalMissions(m, S) {
  return m.missions.map((ms) => {
    const cur = ms.calc(S);
    return {
      label: ms.label, pending: cur === null, done: cur !== null && cur >= ms.target,
      curText: cur === null ? (ms.need || '—') : ms.fmt(cur), targetText: ms.fmt(ms.target),
    };
  });
}

/** 한 건의 왕복 매매를 대가들의 규칙으로 채점한다 */
function reviewTrade(c) {
  const good = [], bad = [], x = c.ctx;
  if (x) {
    (x.mkt ? good : bad).push(x.mkt ? '시장이 상승 추세일 때 들어갔어요' : '시장이 아래를 향할 때 들어갔어요');
    (x.trend ? good : bad).push(x.trend ? '200일선 위, 추세가 살아 있는 자리였어요' : '200일선 아래에서 샀어요');
    if (x.near) good.push('52주 고가 근처였어요');
    if (x.vol) good.push('거래량이 터질 때 들어갔어요');
    if (x.stop) good.push(`손절선을 ${pct(x.stopPct)} 아래에 긋고 샀어요`);
    else bad.push('손절선 없이 샀어요');
  }
  const stopped = c.tag.startsWith('손절');
  if (c.pnl <= 0) {
    // 갭하락은 손절선을 뛰어넘는다. 계획한 손실과 실제 손실이 다른 이유를 짚어준다
    if (c.tag === '손절(갭)' && x?.stopPct != null && c.ret < x.stopPct - 0.03)
      bad.push(`갭하락으로 손절선(${pct(x.stopPct)})을 건너뛰고 ${pct(c.ret)}에 체결됐어요`);
    else if (stopped && c.ret >= -0.12) good.push('손절 원칙대로 잘랐어요');
    else if (!stopped && c.ret < -0.15) bad.push(`손절 없이 ${pct(c.ret)}까지 버텼어요`);
  } else {
    if (c.ret >= 0.25) good.push(`${pct(c.ret)}까지 끌고 갔어요`);
    else if (c.ret < 0.05 && c.exitDay - c.entryDay < 60) bad.push('이익을 너무 빨리 잘랐어요');
  }
  return { good, bad };
}

/**
 * 매수 평단을 굴리며 매도 시점마다 한 건의 "왕복 매매"를 만든다.
 * 진입일·진입 맥락을 같이 달고 나와야 사후 복기에서 무엇이 잘못됐는지 짚을 수 있다.
 */
function closedTrades() {
  const book = {}, out = [];
  for (const t of trades) {
    const b = (book[t.id] ||= { qty: 0, cost: 0, ctx: null, day: t.day });
    if (t.side === 'buy') {
      if (b.qty <= 1e-9) b.day = t.day;                  // 신규 진입일 (물타기는 최초 진입일 유지)
      b.cost = (b.cost * b.qty + t.px * t.qty) / (b.qty + t.qty);
      b.qty += t.qty;
      if (t.ctx) b.ctx = t.ctx;
    } else {
      const q = Math.min(t.qty, b.qty);
      if (q > 0) out.push({
        id: t.id, qty: q, entryDay: b.day, exitDay: t.day, entryPx: b.cost, exitPx: t.px,
        pnl: (t.px - b.cost) * q, ret: t.px / b.cost - 1, tag: t.tag || '', ctx: b.ctx,
      });
      b.qty -= q;
      if (b.qty <= 1e-9) { b.qty = 0; b.cost = 0; b.ctx = null; }
    }
  }
  return out;
}

function tradeStats(closed = closedTrades()) {
  const wins = closed.filter((c) => c.pnl > 0), losses = closed.filter((c) => c.pnl <= 0);
  const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const avgWin = wins.length ? sum(wins, (c) => c.pnl) / wins.length : 0;
  const avgLoss = losses.length ? Math.abs(sum(losses, (c) => c.pnl) / losses.length) : 0;
  const perStock = {};
  for (const c of closed) perStock[c.id] = (perStock[c.id] || 0) + c.pnl;
  return {
    n: closed.length, nWin: wins.length, nLoss: losses.length,
    winRate: closed.length ? wins.length / closed.length : 0,
    payoff: avgLoss > 0 ? avgWin / avgLoss : 0,
    avgLossPct: losses.length ? sum(losses, (c) => c.ret) / losses.length : 0,
    avgWinPct: wins.length ? sum(wins, (c) => c.ret) / wins.length : 0,
    // 손실 청산 중 손절선으로 정리된 비율. 대가들의 공통 규칙을 얼마나 지켰는지
    stopRate: losses.length ? losses.filter((c) => c.tag.startsWith('손절')).length / losses.length : null,
    perStock,
  };
}

function buildResult() {
  const T = D.meta.gameDays;
  let eq = cash;
  const per = {};
  for (const s of D.stocks) {
    const p = pos[s.id];
    if (p?.qty) { eq += p.qty * series(s).c[T]; per[s.id] = (series(s).c[T] - p.cost) * p.qty; }
  }
  const ts = tradeStats();
  for (const [id, v] of Object.entries(ts.perStock)) per[id] = (per[id] || 0) + v;

  const bi = START_CASH * (D.index[T] / D.index[WARMUP]);
  const be = ewPath[T];
  const years = D.meta.playDays / D.meta.daysPerYear;
  return {
    eq, per, ts, bi, be, br: ewrPath[T], years,
    ret: eq / START_CASH - 1,
    alpha: eq / bi - 1,        // 지수 대비 — 화면 표시용
    alphaEW: eq / be - 1,      // 동일가중 B&H 대비 — 등급·순위용. 종목 운을 제거한 진짜 실력
    cagr: Math.pow(Math.max(eq, 1) / START_CASH, 1 / years) - 1,
    mdd, seed: runSeed,
  };
}

/**
 * 등급 기준은 "받은 종목을 그냥 다 들고 있었다면"(동일가중 B&H) 대비다.
 * 지수 대비로 매기면 아무것도 안 해도 90%가 S를 받는다 (tools/check-benchmark.mjs).
 * 낙폭이 크면 등급을 깎는다 — 계좌를 반토막 내고 얻은 수익은 이 게임의 최고점이 아니다.
 */
function gradeOf(R) {
  const ORDER = ['C', 'B', 'A', 'S'];
  const a = R.alphaEW;
  const byAlpha = a >= 0.5 ? 'S' : a >= 0.15 ? 'A' : a >= -0.15 ? 'B' : 'C';
  const cap = R.mdd <= -0.6 ? 'B' : R.mdd <= -0.45 ? 'A' : 'S';
  const g = ORDER.indexOf(byAlpha) > ORDER.indexOf(cap) ? cap : byAlpha;
  const label = {
    S: '가만히 있는 것보다 훨씬 잘했어요',
    A: '가만히 있는 것보다 잘했어요',
    B: '가만히 있는 것과 비슷해요',
    C: '가만히 두는 게 나았어요',
  }[byAlpha];
  const sr = R.ts.stopRate;
  const risk = g !== byAlpha
    ? `최대 낙폭 ${pct(R.mdd)} — 등급이 ${byAlpha}에서 ${g}로 깎였어요`
    : R.mdd > -0.3 && (sr === null || sr >= 0.6) ? '리스크 관리 양호'
    : sr !== null && sr < 0.3 ? '손절 원칙이 거의 없었어요'
    : '리스크 관리 보통';
  return { g, label, risk };
}

/** 30년 자산 곡선 — 내 자산 / 시장지수 / 동일가중 B&H, 위기 구간 음영 */
function drawEquityCurve() {
  const el = $('eqCurve');
  if (!el || !eqPath) return;
  const W = el.clientWidth, H = el.clientHeight;
  if (W < 50) return;
  const dpr = window.devicePixelRatio || 1;
  el.width = Math.floor(W * dpr); el.height = Math.floor(H * dpr);
  const g = el.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const T = D.meta.gameDays, PADR = 44, PADB = 16, PADT = 8;
  const idxAt = (t) => START_CASH * (D.index[t] / D.index[WARMUP]);
  const lines = [
    { col: '#8b95a1', w: 1.3, at: idxAt },
    { col: '#ff9f0a', w: 1.3, at: (t) => ewPath[t] },
    { col: '#3182f6', w: 2.0, at: (t) => eqPath[t] },      // 마지막에 그려야 위에 온다
  ];

  let lo = Infinity, hi = -Infinity;
  for (let t = WARMUP; t <= T; t++) for (const L of lines) {
    const v = L.at(t);
    if (v > 0) { if (v < lo) lo = v; if (v > hi) hi = v; }
  }
  lo = Math.max(lo, START_CASH * 0.005);                    // 파산해도 축이 무너지지 않게
  const L0 = Math.log(lo) - 0.08, L1 = Math.log(hi) + 0.08;
  const X = (t) => ((t - WARMUP) / (T - WARMUP)) * (W - PADR);
  const Y = (v) => PADT + (H - PADT - PADB) * (1 - (Math.log(Math.max(v, lo)) - L0) / (L1 - L0));

  // 위기 구간 음영
  g.fillStyle = 'rgba(240,68,82,.10)';
  for (const c of D.crashWindows) g.fillRect(X(c.a), 0, Math.max(1, X(c.b) - X(c.a)), H - PADB);

  // 배수 눈금
  g.font = '600 10px -apple-system,Segoe UI,sans-serif';
  g.textAlign = 'left'; g.textBaseline = 'middle';
  for (let k = 0; k <= 4; k++) {
    const v = Math.exp(L0 + (L1 - L0) * (k / 4)), y = Y(v);
    g.strokeStyle = '#eef1f4'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W - PADR, y + .5); g.stroke();
    g.fillStyle = '#b0b8c1';
    const m = v / START_CASH;
    g.fillText(m >= 1 ? `${m < 10 ? m.toFixed(1) : Math.round(m)}배` : `${(m * 100).toFixed(0)}%`, W - PADR + 5, y);
  }
  // 원금선
  g.strokeStyle = '#d1d6db'; g.lineWidth = 1; g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(0, Y(START_CASH)); g.lineTo(W - PADR, Y(START_CASH)); g.stroke(); g.setLineDash([]);

  // 연차 눈금
  g.textAlign = 'center'; g.fillStyle = '#b0b8c1';
  for (let y = 0; y <= 30; y += 5) {
    const t = WARMUP + y * D.meta.daysPerYear;
    if (t > T) break;
    g.fillText(y === 0 ? '시작' : `${y}년`, X(t), H - PADB / 2 + 2);
  }

  const step = Math.max(1, Math.floor((T - WARMUP) / (W * 2)));
  for (const L of lines) {
    g.strokeStyle = L.col; g.lineWidth = L.w; g.lineJoin = 'round';
    g.beginPath();
    for (let t = WARMUP; t <= T; t += step) (t === WARMUP ? g.moveTo : g.lineTo).call(g, X(t), Y(L.at(t)));
    g.lineTo(X(T), Y(L.at(T)));
    g.stroke();
  }
}

/** 멘토 3챕터 성적 + 매매별 코칭 */
function reviewHtml() {
  const yr = (d) => ((d - WARMUP) / D.meta.daysPerYear + 1).toFixed(1);
  const mentorRows = MENTORS.map((m) => {
    const ok = evalMissions(m, mentorStats(m)).filter((r) => r.done).length;
    return `<div class="mtrow">
      <div class="mtn"><b>${m.name}</b><small>${m.a + 1}~${m.b}년차 · "${m.line}"</small></div>
      <div class="mtscore ${ok >= 2 ? 'up' : ok === 0 ? 'down' : 'flat'}">${ok}/3</div>
    </div>`;
  }).join('');

  const closed = closedCached();
  if (!closed.length) {
    return `<div class="sect" style="margin-top:0">멘토 미션</div>${mentorRows}
      <div class="empty">청산한 매매가 없어 복기할 것이 없어요</div>`;
  }
  const recent = closed.slice().reverse().slice(0, 40);
  const list = recent.map((c) => {
    const v = reviewTrade(c);
    return `<div class="trev">
      <div class="th">
        <b>${names[c.id]}</b>
        <small>${yr(c.entryDay)}년차 → ${yr(c.exitDay)}년차 · ${c.tag || '매도'}</small>
        <span class="rt ${cls(c.pnl)}">${pct(c.ret)} · ${c.pnl >= 0 ? '+' : ''}${won(c.pnl)}</span>
      </div>
      <ul>${v.good.map((t) => `<li class="g">${t}</li>`).join('')}${v.bad.map((t) => `<li class="b">${t}</li>`).join('')}</ul>
    </div>`;
  }).join('');

  return `<div class="sect" style="margin-top:0">멘토 미션</div>${mentorRows}
    <div class="sect">매매 복기 <span style="font-weight:600;color:var(--sub2)">
      ${closed.length > 40 ? `최근 40건 / 총 ${closed.length}건` : `총 ${closed.length}건`}</span></div>
    ${list}`;
}

}

const localBoard = () => { try { return JSON.parse(localStorage.getItem(BOARD_KEY)) || []; } catch { return []; } };
function pushLocal(e) {
  const b = localBoard();
  b.push(e);
  b.sort((x, y) => y.alpha - x.alpha);
  const top = b.slice(0, 50);
  try { localStorage.setItem(BOARD_KEY, JSON.stringify(top)); } catch {}
  return top;
}
async function sbFetch() {
  const r = await fetch(`${SB.url}/rest/v1/${SB.table}?select=name,alpha,ret,mdd,stop_rate,trades&order=alpha.desc&limit=10`,
    { headers: { apikey: SB.key, Authorization: `Bearer ${SB.key}` } });
  if (!r.ok) throw new Error(`조회 실패 (${r.status})`);
  return (await r.json()).map((x) => ({ name: x.name, alpha: x.alpha, ret: x.ret, mdd: x.mdd, stopRate: x.stop_rate, n: x.trades }));
}
async function sbSubmit(e) {
  const r = await fetch(`${SB.url}/rest/v1/${SB.table}`, {
    method: 'POST',
    headers: { apikey: SB.key, Authorization: `Bearer ${SB.key}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ name: e.name, alpha: e.alpha, alpha_idx: e.alphaIdx, ret: e.ret,
                           mdd: e.mdd, stop_rate: e.stopRate, trades: e.n, seed: String(e.seed) }),
  });
  if (!r.ok) throw new Error(`등록 실패 (${r.status})`);
}

      </div>

}

async function renderBoard() {
  const R = lastResult;
  const saved = localStorage.getItem(NAME_KEY) || '';
  const head = `<div class="note" style="margin:0 0 12px">순위는 <b>전 종목 묻어두기 대비</b> 기준입니다.
    뽑힌 종목을 그냥 다 들고만 있었을 때가 0%이고, 매매로 그걸 얼마나 넘겼는지로 겨룹니다.
    종목 운이 빠지므로 판이 달라도 공정합니다.</div>`;
  const form = submitted ? '' : `
    <input class="nameIn" id="lbName" maxlength="12" placeholder="이름 (최대 12자)" value="${saved.replace(/"/g, '')}">
    <div class="qtyrow" style="margin-top:8px"><button id="lbSubmit" style="padding:11px 0;font-size:13px">내 기록 등록하기</button></div>
    <div class="note" id="lbMsg"></div>`;

  $('mBody').innerHTML = head + `<div id="lbList"><div class="empty">불러오는 중…</div></div>` + form + (sbOn()
    ? '' : `<div class="note">온라인 리더보드가 아직 연결되지 않아 <b>이 브라우저에만</b> 기록이 남습니다.</div>`);

  const mine = { name: saved, alpha: R.alphaEW, alphaIdx: R.alpha, ret: R.ret,
                 mdd: R.mdd, stopRate: R.ts.stopRate, n: R.ts.n, seed: R.seed };
  try {
    boardCache = sbOn() ? await sbFetch() : localBoard();
  } catch (e) {

  const idx = submitted ? boardCache.findIndex((x) => Math.abs(x.alpha - mine.alpha) < 1e-9 && x.name === mine.name) : -1;
  $('lbList').innerHTML = boardRows(boardCache, idx);

  const btn = $('lbSubmit');
  if (btn) btn.onclick = async () => {
    const nm = ($('lbName').value || '').trim().slice(0, 12);
    if (!nm) { $('lbMsg').textContent = '이름을 입력해 주세요.'; return; }
    btn.disabled = true; $('lbMsg').textContent = '등록 중…';
    mine.name = nm;
    try { localStorage.setItem(NAME_KEY, nm); } catch {}
    try {
      if (sbOn()) await sbSubmit(mine);
      pushLocal(mine);
      submitted = true;
      renderBoard();
    } catch (e) {
      pushLocal(mine); submitted = true;
      $('lbMsg').textContent = `${e.message} — 이 브라우저에는 저장했습니다.`;
      btn.disabled = false;
    }
  };
}

async function newRun() {
  if (busy) return;
  busy = true; setSpeed(0);
  runSeed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  clearSave();
  try { await startRun({}); } finally { busy = false; }
  renderUI();
}

/* 개발용 디버그 핸들 */
window.__dbg = {
  get D() { return D; },
  get state() {
    return { day, viewDay, cash, pos: JSON.parse(JSON.stringify(pos)), stops: { ...stops },
             equity: equityAt(day), mdd, risk: accountRisk(), trades: trades.length, ordSide };
  },
  adv(n = 1) { let p = 0; for (let i = 0; i < n && day < D.meta.gameDays; i++) if (advanceDay()) p++; viewDay = day; renderUI(); return { day, paused: p }; },
  finish() { const ap = autoPause; autoPause = false; ffwd = true; while (day < D.meta.gameDays) advanceDay(); ffwd = false; autoPause = ap; viewDay = day; renderUI(); return lastResult; },
  mentor() { const m = mentorAt(day); return { m: m.name, missions: evalMissions(m, mentorStats(m)) }; },
  review() { return closedCached().map((c) => ({ id: c.id, ret: +(c.ret * 100).toFixed(1), tag: c.tag, ...reviewTrade(c) })); },
  result() { return lastResult; },
  stats() { return tradeStats(); },
  save() { saveGame(); return JSON.parse(localStorage.getItem(SAVE_KEY)); },
  hasSave() { return !!loadSave(); },
  wipe() { clearSave(); localStorage.removeItem(BOARD_KEY); localStorage.removeItem(INTRO_KEY); },
  tickNews(now) { return currentNews(now); },
  news(n = 12) {
    const o = [];
    for (let i = 0; i < n; i++) {
      viewDay = day;
      const c = newsCandidate(Math.floor(viewDay));
      o.push(`[${String(c.score).padStart(3)}] ` + c.html.replace(/<[^>]+>/g, ''));
      advanceDay();
    }
    viewDay = day; renderUI();
    return o;
  },
  tab(t) { setModalTab(t); },
  curve() { drawEquityCurve(); const c = $('eqCurve'); return c ? `${c.width}x${c.height}` : 'none'; },
  board() { return localBoard(); },
  select(i) { sel = i; snapScale = true; renderUI(); },
  openOrder(v) { openOrder(v); return { qty: ordQty, max: maxQtyFor(v) }; },
  closeOrder() { closeOrder(); },
  setOrdQty(v) { setOrdQty(v); return ordQty; },
  confirm() { confirmOrder(); },
  ordOpen() { return ordOpen(); },
  toggleStopDrawer() { ordStopOpen = !ordStopOpen; renderOrder(); return ordStopOpen; },
  order(s_, q) { pending = { id: D.stocks[sel].id, side: s_, qty: q / DV() }; renderUI(); },
  setStop(pDisp) { stops[D.stocks[sel].id] = pDisp * DV(); everUsedStop = true; renderUI(); },
  setAutoPause(v) { autoPause = v; syncPauseUI(); },
  setPauseOpt(o) { Object.assign(pauseOpt, o); syncPauseUI(); },
  setPauseCd(v) { pauseCd = v; pauseCool = {}; syncPauseUI(); },
  get pauseState() { return { autoPause, pauseOpt: { ...pauseOpt }, pauseCd }; },
  setSmooth(v) { smooth = v; if (!v) viewDay = day; },
  setVis(n) { visN = n; snapScale = true; },
  setViewDay(v) { viewDay = v; },
  px() { return dispPriceOf(D.stocks[sel]) / DV(); },
  dv() { return DV(); },
  maxQty(v = ordSide) { return maxQtyFor(v); },
  draw() { drawChart(0.016); },
  render() { renderUI(); },
};

load();
</script>
